<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#120c0e">
<title>Zuniga Philosophy (preview)</title>
<!-- Zuniga Philosophy (Blake t459u/t460u): PREVIEW ONLY, direct URL only. Not linked from the home apps row. -->
<style>
@font-face{font-family:'Zuniga Mission';src:url('../../assets/fonts/ZunigaMission-Regular-v3.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
html,body{margin:0;min-height:100%;background:#120c0e;color:#f1e9e6}
body{font-family:'Zuniga Mission',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
#zp-app{min-height:100vh}
.zp-boot{margin:0;padding:40px 20px;text-align:center;font-family:'Zuniga Mission',system-ui,sans-serif;letter-spacing:.06em;color:rgba(241,233,230,.62)}
</style>
</head>
<body>
<div id="zp-app"><p class="zp-boot">Opening the notebook…</p></div>
<noscript><p class="zp-boot">Zuniga Philosophy needs JavaScript.</p></noscript>
<script type="module">
// Full set later: a paid, server-gated endpoint passed as fullUrl. Never a static public file. Sample until then.
const el = document.getElementById('zp-app');
try {
  const { mountZunigaPhilosophy } = await import('./zuniga-philosophy.js');
  mountZunigaPhilosophy(el, { booksUrl: new URL('./data/sample.json', location.href).href, hash: true });
} catch (err) {
  console.warn('[zuniga-philosophy] could not load the module', err);
  el.innerHTML = '<p class="zp-boot">Zuniga Philosophy could not be opened right now.</p>';
}
</script>
</body>
</html>
