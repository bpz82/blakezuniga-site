<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Home layout editor — Blake Zuniga</title>
  <link rel="preload" href="assets/fonts/ZunigaMission-Regular-v3.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="editor/editor.css">
  <link rel="stylesheet" href="layout/photo-manager.css">
</head>
<body>
  <header id="bar">
    <div class="row" id="bar-top">
      <h1>Layout editor</h1>
      <div class="seg" id="mode-seg" role="tablist" aria-label="Mode">
        <button type="button" id="btn-mode-layout" class="on" aria-pressed="true">Layout</button>
        <button type="button" id="btn-mode-photos" aria-pressed="false">Photos</button>
      </div>
      <div class="seg layout-only" id="view-seg" role="tablist" aria-label="View">
        <button type="button" id="btn-desk" class="on" aria-pressed="true">Desktop</button>
        <button type="button" id="btn-phone" aria-pressed="false">Phone</button>
      </div>
      <p class="hint photos-only">Precious Memories photos. Add from your library, mark ones to remove, then Export changes and send the file back. Nothing is deleted until that file is applied with your OK.</p>
    </div>
    <div class="row tools layout-only" id="tools">
      <button type="button" class="btn icon" id="btn-undo" disabled aria-label="Undo">Undo</button>
      <button type="button" class="btn icon" id="btn-redo" disabled aria-label="Redo">Redo</button>
      <button type="button" class="btn toggle" id="btn-snap" aria-pressed="false">Snap: off</button>
      <button type="button" class="btn primary" id="btn-copy">Copy JSON</button>
      <button type="button" class="btn" id="btn-dl">Download</button>
      <button type="button" class="btn warn" id="btn-reset">Reset this view</button>
    </div>
    <div class="row chips layout-only" id="chips" role="tablist" aria-label="Item"></div>
    <p id="status" class="layout-only">Loading the scene…</p>
  </header>
  <div id="stage-wrap"><div id="stage-clip"><iframe id="stage" title="Home scene"></iframe></div></div>
  <section id="inspector" class="layout-only" hidden aria-label="Selected object">
    <div class="ins-head"><strong id="ins-title"></strong><button type="button" class="btn small" id="btn-reset-item">Reset this item</button></div>
    <div id="fields"></div>
  </section>
  <div id="photo-manager" hidden></div>
  <!-- phone chrome (editor/ui.js moves the controls in here on narrow / short screens). The tab bar is a flex sibling under the stage;
       the expanded sheet opens upward over the stage, so a collapsed sheet never covers it. -->
  <nav id="sheet" class="compact-only" aria-label="Editor controls">
    <div id="sheet-body" hidden>
      <div id="pane-layout" class="pane"></div>
      <div id="pane-json" class="pane" hidden>
        <textarea id="json-view" readonly spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Current layout JSON"></textarea>
        <div class="row" id="json-actions"><button type="button" class="btn small" id="btn-json-select">Select all</button></div>
      </div>
    </div>
    <div id="tabbar" role="tablist" aria-label="Editor tabs"><button type="button" class="tab" id="btn-json" aria-pressed="false" aria-expanded="false">JSON</button></div>
  </nav>
  <script src="layout/photo-manager.js" defer></script>
  <script type="module" src="editor/ui.js"></script>
</body>
</html>
