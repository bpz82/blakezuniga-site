<style>

  #hud{position:fixed;left:calc(14px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));right:14px;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.9)}
  #title{font-size:12px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;opacity:.85}

  #joy{position:fixed;left:calc(18px + env(safe-area-inset-left));bottom:calc(26px + env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;display:none;z-index:3;touch-action:none;background:radial-gradient(circle,rgba(255,255,255,.05),rgba(255,255,255,.12));border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

  #joy.on i{background:rgba(255,255,255,.42)}
  #right{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(34px + env(safe-area-inset-bottom));display:none;z-index:3;touch-action:none}
  body.touch #joy,body.touch #right{display:block}
  .b{box-sizing:border-box;width:64px;height:64px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22);border-radius:50%;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);touch-action:none}
  .b.down{background:rgba(255,255,255,.28)}

  #joy,#right,#mode,#hud{-webkit-user-select:none;user-select:none}
  #flip{position:fixed;top:calc(52px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));z-index:3;font:600 11px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#ddd;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:9px 14px;cursor:pointer;min-width:84px}
  #mode{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));z-index:3;font:600 11px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#ddd;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:9px 14px;cursor:pointer}

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';   // head4 (Grok Nov 14 9:46): post AA for thin chrome/tuner edges at distance
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
let TX = {}, Q = {};

/* stage5 (Grok Nov 14 9:46, Blake 'this is messy'): floor falls off to black (radial albedo falloff, matte, walk fill lights excluded),
   soft natural floor shadow (VSM blur), FXAA after tone mapping for thin chrome edges. stage4 kept. */
/* stage4 (Grok Nov 13 9:28): organic film grain (slow cross-faded, multiplicative, black stays black). stage3 kept. */
// ───────────────────────── STAGE v3 (under-fill for 360 orbit) / v2 (Grok, Nov 13 7:10 fixes: glare, steady black, full shadow) ─────────────────────────
// Dramatic black studio void: baked softbox env (reflections), low-key key/rim
// spots with soft shadows, glossy black floor + warm floor glow, bloom/vignette/grain.
function setupStage(renderer, scene, camera, focus) {
  const C = (focus && focus.center ? focus.center : new THREE.Vector3(0, 27, 0)).clone();
  const R = (focus && focus.radius) || 70;
  const mobile = !!(typeof Q !== 'undefined' && Q.mobile);
  const shadowSize = (typeof Q !== 'undefined' && Q.shadowSize) || (mobile ? 1024 : 2048);

  // 1. Renderer / scene basics ------------------------------------------------
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.VSMShadowMap;   // stage5: blurred variance shadows -> soft, natural floor shadow (PCFSoft ignores radius: the neck/headstock shadow was razor hard)
  renderer.setClearColor(0x000000, 1);

  scene.background = new THREE.Color(0x000000);
  scene.fog = new THREE.Fog(0x000000, R * 5.5, R * 13);

  // 2. Environment map: black studio with a few emissive softboxes ----------------
  const envScene = new THREE.Scene();
  envScene.background = new THREE.Color(0x000000);
  const panelGeo = new THREE.PlaneGeometry(1, 1);
  function panel(w, h, pos, rgb, power) {
    const m = new THREE.MeshBasicMaterial({
      color: new THREE.Color(rgb[0] * power, rgb[1] * power, rgb[2] * power),
      side: THREE.DoubleSide, fog: false
    });
    const p = new THREE.Mesh(panelGeo, m);
    p.scale.set(w, h, 1);
    p.position.set(pos[0], pos[1], pos[2]);
    p.lookAt(0, 0, 0);
    envScene.add(p);
    return p;
  }
  // Large warm overhead softbox, pushed off the zenith (toward the headstock side)
  // so a top-down/hero camera does not mirror it straight into the body.
  panel(15, 9, [2.0, 9.0, -5.5], [1.0, 0.96, 0.90], 0.85);   // Grok v2: wider + much softer overhead softbox (no blown reflection from above)
  // Two long thin cool strips, high and behind, for rim reflections along edges/chrome.
  panel(0.6, 11, [-10, 4.5, -7], [0.80, 0.90, 1.00], 5.5);
  panel(0.6, 11, [10, 4.5, -7], [0.85, 0.92, 1.00], 5.0);
  // Broad dim zenith scrim so flat chrome tops read silver, not black (Grok tune).
  panel(16, 12, [-1.5, 10, 2.5], [1.0, 0.98, 0.95], 0.2);
  // Low horizon strips all round for chrome edge pings.
  panel(18, 1.2, [0, 1.2, -12], [1, 1, 1], 0.55);   // Grok v2: dimmer (grazing clearcoat glare in walk view)
  panel(1.2, 3, [-12, 1.5, 4], [1, 0.95, 0.9], 0.8);
  // Dim large low-front bounce card.
  panel(14, 7, [0, -0.5, 11], [0.95, 0.88, 0.80], 0.14);   // Grok v2: halved (walk-view glint on vertical chrome faces)
  // Very faint grey gradient dome so clearcoat never goes pitch black.
  {
    const dome = new THREE.SphereGeometry(30, 32, 16);
    const pos = dome.attributes.position;
    const col = new Float32Array(pos.count * 3);
    for (let i = 0; i < pos.count; i++) {
      const t = Math.max(0, pos.getY(i) / 30);          // 0 at/below horizon, 1 at zenith
      const g = 0.002 + 0.03 * t * t;
      col[i * 3] = g * 0.95; col[i * 3 + 1] = g * 0.97; col[i * 3 + 2] = g * 1.05;
    }
    dome.setAttribute('color', new THREE.BufferAttribute(col, 3));
    envScene.add(new THREE.Mesh(dome, new THREE.MeshBasicMaterial({
      vertexColors: true, side: THREE.BackSide, fog: false
    })));
  }
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = pmrem.fromScene(envScene, 0.03).texture;
  pmrem.dispose();
  envScene.traverse(o => { if (o.isMesh) o.material.dispose(); });
  panelGeo.dispose();
  scene.environment = env;
  scene.environmentIntensity = 1.0;

  // 3. Real lights: low-key cinematic ----------------------------------------
  // E = desired irradiance at the guitar; intensity is derived for decay 2.
  function spot(hex, E, offset, angle, penumbra, targetOffset) {
    const L = new THREE.SpotLight(hex, 1, 0, angle, penumbra, 2);
    L.position.copy(C).add(offset);
    L.target.position.copy(C);
    if (targetOffset) L.target.position.add(targetOffset);
    const d = L.position.distanceTo(L.target.position);
    L.intensity = E * d * d;
    L.castShadow = false;
    scene.add(L, L.target);
    return L;
  }
  // Key: above, a little toward the treble side and the front, warm white.
  // Grok v2: lower key + wider/softer cone so the whole guitar AND its floor shadow (neck + headstock) are inside the shadow frustum
  const key = spot(0xfff1e0, 2.9, new THREE.Vector3(R * 1.1, R * 2.2, R * 1.3), 0.52, 0.9,
    new THREE.Vector3(-R * 0.15, -R * 0.35, -R * 0.35));
  key.castShadow = true;
  key.shadow.mapSize.set(shadowSize, shadowSize);
  {
    const d = key.position.distanceTo(key.target.position);
    key.shadow.camera.near = Math.max(1, d - R * 1.9);
    key.shadow.camera.far = d + R * 1.6;
    key.shadow.bias = -0.0004;
    key.shadow.normalBias = mobile ? 0.5 : 0.32;
    key.shadow.radius = mobile ? 7 : 11;      // stage5: penumbra ~ a softbox 8" above the floor
    key.shadow.blurSamples = mobile ? 10 : 16;
    key.shadow.focus = 1;
  }
  // Rims: cool from behind-left (bass side), warmer from behind-right (treble side).
  spot(0xcfe0ff, 1.6, new THREE.Vector3(-R * 1.6, R * 1.25, -R * 2.1), 0.55, 0.9);   // Grok v2: rims lower + a bit higher (their clearcoat glints were the walk-view glare blobs)
  spot(0xffd9b0, 1.15, new THREE.Vector3(R * 1.75, R * 1.0, -R * 1.9), 0.55, 0.9);
  // Grok tune: dim warm bounce from the floor glow so the back, neck back and headstock-back tuners read when orbiting low.
  spot(0xffd2a8, 0.75, new THREE.Vector3(R * 0.3, -R * 0.3, R * 1.2), 0.9, 1.0);   // Grok v2: weaker + lower (it glinted off vertical chrome faces straight into the walk camera)
  spot(0xc8d6ff, 0.8, new THREE.Vector3(-R * 0.6, -R * 0.1, -R * 1.6), 0.9, 1.0);
  // v3 (Grok 7:51): under-fill for the 360 orbit — a soft warm spot from below, faded in by the app only when the camera goes under the guitar
  const under = spot(0xffe2c4, 2.2, new THREE.Vector3(R * 0.4, -R * 1.6, R * 0.5), 0.75, 1.0);
  const underI = under.intensity; under.intensity = 0;
  // Extremely weak hemisphere so the underside is not a void.
  scene.add(new THREE.HemisphereLight(0x27303f, 0x0a0705, 0.08));

  // 4. Floor (Grok v2): ONE surface. The warm glow is baked into the floor's emissiveMap instead of a
  // second additive plane 0.12 above it (that coplanar pair z-fought on iPhone depth buffers -> black flicker).
  // A ShadowMaterial catcher just above carries the key-light shadow over the glow (emissive is never shadowed).
  const FR = R * 22;
  let glowTex;
  {
    const S = 2048, cv = document.createElement('canvas'); cv.width = cv.height = S;
    const g = cv.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, S, S);
    const rx = S * (R * 1.7) / (2 * FR), ry = S * (R * 2.6) / (2 * FR);
    g.save(); g.translate(S / 2, S / 2); g.scale(rx, ry);
    const grad = g.createRadialGradient(0, 0, 0, 0, 0, 1);
    grad.addColorStop(0.0, 'rgb(70,40,26)'); grad.addColorStop(0.3, 'rgb(34,19,12)');
    grad.addColorStop(0.62, 'rgb(8,4,3)'); grad.addColorStop(1.0, 'rgb(0,0,0)');
    g.fillStyle = grad; g.beginPath(); g.arc(0, 0, 1, 0, Math.PI * 2); g.fill(); g.restore();
    glowTex = new THREE.CanvasTexture(cv); glowTex.colorSpace = THREE.SRGBColorSpace; glowTex.anisotropy = 4;
  }
  // stage5: the floor's light response falls off to black away from the guitar (albedo map), it is fully matte (the walk camera saw
  // a hot specular sheen of the key at grazing angles), and the walk-mode fill lights (directional, no falloff) never touch it:
  // they turned the whole floor flat grey in Blake's back-walk screenshot.
  let fallTex;
  {
    const S = 1024, cv = document.createElement('canvas'); cv.width = cv.height = S;
    const g = cv.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, S, S);
    const rx = S * (R * 1.5) / (2 * FR), ry = S * (R * 2.1) / (2 * FR);
    g.save(); g.translate(S / 2, S / 2); g.scale(rx, ry);
    const grad = g.createRadialGradient(0, 0, 0, 0, 0, 1);
    grad.addColorStop(0.0, 'rgb(255,255,255)'); grad.addColorStop(0.35, 'rgb(190,190,190)'); grad.addColorStop(0.7, 'rgb(60,60,60)'); grad.addColorStop(1.0, 'rgb(0,0,0)');
    g.fillStyle = grad; g.beginPath(); g.arc(0, 0, 1, 0, Math.PI * 2); g.fill(); g.restore();
    fallTex = new THREE.CanvasTexture(cv); fallTex.colorSpace = THREE.SRGBColorSpace;
  }
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x050505, map: fallTex, roughness: 1, metalness: 0, envMapIntensity: 0.0, emissive: 0xffffff, emissiveMap: glowTex });
  floorMat.onBeforeCompile = sh => {   // drop directional lights (walk-mode side fills) from the floor only
    sh.fragmentShader = sh.fragmentShader.replace('#include <lights_fragment_begin>', THREE.ShaderChunk.lights_fragment_begin.split('NUM_DIR_LIGHTS > 0').join('NUM_DIR_LIGHTS < 0'));
  };
  const floor = new THREE.Mesh(new THREE.CircleGeometry(FR, 72), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(C.x, 0, C.z);
  floor.receiveShadow = true;
  scene.add(floor);
  const catcher = new THREE.Mesh(new THREE.PlaneGeometry(R * 6, R * 6),
    new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.5, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 }));
  catcher.rotation.x = -Math.PI / 2; catcher.position.set(C.x, 0.3, C.z); catcher.receiveShadow = true; catcher.renderOrder = 1;
  scene.add(catcher);

  // 5. Post-processing ---------------------------------------------------------
  const size = renderer.getSize(new THREE.Vector2());
  const pr0 = renderer.getPixelRatio();
  const rt = new THREE.WebGLRenderTarget(Math.max(1, size.x * pr0 | 0), Math.max(1, size.y * pr0 | 0), {
    type: THREE.HalfFloatType, samples: mobile ? 2 : 4
  });
  const composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(size.x, size.y), mobile ? 0.1 : 0.13, 0.35, 1.0);   // Grok v2: softer bloom, higher threshold (less glare halo)
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  const FinalShader = {
    uniforms: {
      tDiffuse: { value: null },
      uTime: { value: 0 },
      uGrain: { value: 0.16 },   // v4: multiplicative film grain amplitude (~±6% in mid-tones)
      uVig: { value: 0.35 }
    },
    vertexShader: /* glsl */`
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`
      uniform sampler2D tDiffuse;
      uniform float uTime, uGrain, uVig;
      varying vec2 vUv;
      float hash(vec2 p) {
        vec3 p3 = fract(vec3(p.xyx) * 0.1031);
        p3 += dot(p3, p3.yzx + 33.33);
        return fract((p3.x + p3.y) * p3.z);
      }
      // soft value noise: grain clumps ~1.7 px across, like film rather than per-pixel digital noise
      float vnoise(vec2 p) {
        vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
      }
      void main() {
        vec4 c = texture2D(tDiffuse, vUv);
        float d = length(vUv - 0.5) * 1.41421356;           // 0 centre, 1 corner
        float vig = mix(1.0, uVig, smoothstep(0.32, 1.02, d));
        float lum = dot(c.rgb, vec3(0.299, 0.587, 0.114));
        // Grok v4 (Nov 13 9:28): organic film grain. Two grain fields cross-fade slowly (a new field every ~1/7 s), so
        // any one pixel changes only a little between frames: it breathes instead of sparkling. The grain MULTIPLIES the
        // image, so pure black stays exactly black (steady background); strongest in the mid-tones, gentle in highlights.
        vec2 q = gl_FragCoord.xy / 1.7;
        float t = uTime * 7.0, k = floor(t), a = fract(t);
        vec2 oA = vec2(hash(vec2(k, 1.3)), hash(vec2(k, 7.1))) * 517.0, oB = vec2(hash(vec2(k + 1.0, 1.3)), hash(vec2(k + 1.0, 7.1))) * 517.0;
        float n = mix(vnoise(q + oA), vnoise(q + oB), a) - 0.5;
        n += 0.35 * (hash(gl_FragCoord.xy) - 0.5);           // a touch of fine tooth (static: never flickers)
        float w = smoothstep(0.0, 0.18, lum) * (1.0 - 0.55 * smoothstep(0.55, 1.0, lum));
        c.rgb = c.rgb * vig * (1.0 + n * uGrain * w * vec3(1.0, 0.96, 1.05));
        gl_FragColor = vec4(max(c.rgb, 0.0), c.a);
      }`
  };
  // stage5: FXAA on the tone-mapped image. MSAA resolves BEFORE tone mapping, so very bright chrome pixels (tuners at distance)
  // dominate their edge samples and stay stair-stepped; FXAA on the display-referred image smooths them. Desktop only (phone cost).
  const fxaa = (!mobile && typeof FXAAShader !== 'undefined') ? new ShaderPass(FXAAShader) : null;
  if (fxaa) composer.addPass(fxaa);
  const finalPass = new ShaderPass(FinalShader);
  composer.addPass(finalPass);

  const clock = new THREE.Clock();
  let tOver = null;   // tests: pin the grain clock
  function render() {
    finalPass.uniforms.uTime.value = tOver !== null ? tOver : clock.getElapsedTime() % 1000;
    composer.render();
  }

  function resize(w, h, pixelRatio) {
    const pr = Math.min(pixelRatio || window.devicePixelRatio || 1, mobile ? 2 : 2.5);
    renderer.setPixelRatio(pr);
    renderer.setSize(w, h);
    composer.setPixelRatio(pr);
    composer.setSize(w, h);
    const bw = w * pr, bh = h * pr;
    bloom.setSize(mobile ? bw * 0.5 : bw, mobile ? bh * 0.5 : bh); // internal is /2 again
    if (fxaa) fxaa.material.uniforms.resolution.value.set(1 / Math.max(1, bw), 1 / Math.max(1, bh));
    if (camera.isPerspectiveCamera) {
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
  }
  resize(size.x, size.y, pr0);

  return { composer, render, resize, env, key, floor, bloom, finalPass, fxaa, under, underI, setTime(t) { tOver = t; } };
}

/* body6 (Fable Nov 14 14:55, Blake pic #1 'change picture #1 to the strap button'): second strap button on the bass-shoulder wall by the neck
   (same build as the tail one), output jack moved to the BACK where the back photos show it (flat black barrel, replaces the 'ferrule'). body5 kept. */
/* body5 (Grok Nov 14 9:46, Blake 'this is messy'): roll radius limited by local width (no pinched/self-crossing horn tip), round horn tip,
   lit-wood sides on the cutaway wall, real strap button. body4 kept. */
/* body4 (Grok Nov 14 7:54): big rounded back edge, rounded neck-end corners, glossier sides. body3 kept. */
/* body3 (Grok Nov 13 9:28): back cover centred, shell tagged for back walking. body2 kept. */
// body v2 (Grok, Nov 13 7:10): softer clearcoat (no blown hotspot from the key/softbox)
/* ======================= BODY: Blake's Taylor solid-body, photo-textured ======================= */
/* model frame: +X treble, -Z toward headstock (spec y -> -Z), +Y up; body top Y=0, back Y=-1.75; bridge center at origin */

/* hardware3 (Grok Nov 14 7:54): pickup selector rebuilt on the photographed slot (shape/tip/collar/colour per toggle sheet + photos). hardware2 kept. */
// ---------------- HARDWARE v2 (Grok, Nov 13): bridge + knobs rebuilt from gpt-ref sheets; pickups/selector from Fable's hardware.js ----------------
function hw_v2(x, y) { return new THREE.Vector2(x, y); }
function hw_ss(a, b, x) { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }

// planar UV (x -> u, -z -> v) for one material group of a bd_sweep geometry
function hw_planarUV(geo, gi, su, sv) {
  const g = geo.groups[gi]; if (!g) return;
  const pos = geo.attributes.position; const idx = geo.index;
  let uv = geo.attributes.uv;
  if (!uv) { uv = new THREE.BufferAttribute(new Float32Array(pos.count * 2), 2); geo.setAttribute('uv', uv); }
  const total = idx ? idx.count : pos.count;
  const end = (g.count === Infinity) ? total : Math.min(total, g.start + g.count);
  for (let k = g.start; k < end; k++) {
    const vi = idx ? idx.getX(k) : k;
    uv.setXY(vi, pos.getX(vi) * su, -pos.getZ(vi) * sv);
  }
  uv.needsUpdate = true;
}

function hw_brushedMap() {
  const t = bd_canvas(512, 512, (ctx, w, h) => {
    ctx.fillStyle = '#b4b4b4'; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 1400; i++) {
      const y = Math.random() * h, l = 120 + Math.random() * 100;
      ctx.strokeStyle = 'rgb(' + l + ',' + l + ',' + l + ')';
      ctx.lineWidth = 0.4 + Math.random() * 1.3;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y + (Math.random() - 0.5) * 1.5); ctx.stroke();
    }
  }, false);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// saddle: rounded "tongue" swept along Z, tall tail, scoop, hooked crown at front. base Y = plate top.
function hw_saddleGeo(mobile, base, W) {
  const NZ = mobile ? 20 : 40, NT = mobile ? 8 : 18;
  const prof = new THREE.SplineCurve([
    // Grok fix (Blake's low-angle photo): LOW rear face with the holes, tongue rises toward the hooked crown at the string slot
    hw_v2(0.50, 0.33), hw_v2(0.44, 0.355), hw_v2(0.32, 0.39), hw_v2(0.18, 0.45), hw_v2(0.04, 0.53),
    hw_v2(-0.07, 0.59), hw_v2(-0.15, 0.62), hw_v2(-0.21, 0.60), hw_v2(-0.29, 0.47), hw_v2(-0.37, 0.30),
    hw_v2(-0.45, 0.17), hw_v2(-0.50, 0.125)
  ]);
  const pts = prof.getPoints(NZ);
  const pos = [], idx = [];
  const ringN = NT + 1;
  for (let i = 0; i <= NZ; i++) {
    const z = pts[i].x; const H = Math.max(0.005, Math.min(0.62, pts[i].y) - base);
    const wz = W * (1 - 0.45 * hw_ss(-0.28, -0.5, z));
    const groove = 0.022 * hw_ss(-0.05, 0.08, z) * (1 - hw_ss(0.36, 0.46, z));
    for (let j = 0; j <= NT; j++) {
      const th = Math.PI * j / NT, c = Math.cos(th), s = Math.sin(th);
      let y = base + H * Math.pow(s, 0.72);
      y -= groove * Math.exp(-(c * c) / 0.09) * s;
      pos.push(wz * 0.5 * c, y, z);
    }
  }
  for (let i = 0; i < NZ; i++) for (let j = 0; j < NT; j++) {
    const a = i * ringN + j, b = a + ringN, c = a + 1, d = b + 1;
    idx.push(a, b, c, b, d, c);
  }
  // flat rear (tail) cap with its own vertices
  const capStart = pos.length / 3; const zt = pts[0].x; const Ht = Math.min(0.62, pts[0].y) - base;
  pos.push(0, base + Ht * 0.5, zt);
  for (let j = 0; j <= NT; j++) { const k = j * 3; pos.push(pos[k], pos[k + 1], zt); }
  for (let j = 0; j < NT; j++) idx.push(capStart, capStart + 1 + j, capStart + 2 + j);
  // flat front foot cap
  const fStart = pos.length / 3; const zf = pts[NZ].x;
  pos.push(0, base + 0.004, zf);
  const r0 = NZ * ringN;
  for (let j = 0; j <= NT; j++) { const k = (r0 + j) * 3; pos.push(pos[k], pos[k + 1], zf); }
  for (let j = 0; j < NT; j++) idx.push(fStart, fStart + 2 + j, fStart + 1 + j);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

function buildHardware() {
  const group = new THREE.Group(); group.name = 'hardware';
  const colliders = [];
  const M = !!Q.mobile;
  const SEG = M ? 10 : 22;
  const D2R = Math.PI / 180;

  // ---- materials ----
  const chrome = new THREE.MeshStandardMaterial({ color: 0xd2d4d6, metalness: 1, roughness: 0.18, envMapIntensity: 0.8 });   // Grok 7:10 glare pass
  const satin = new THREE.MeshStandardMaterial({ color: 0xc8cbcf, metalness: 1, roughness: 0.42, roughnessMap: hw_brushedMap(), envMapIntensity: 0.75 });   // Grok 7:10: pickup tops no longer blow out under the key light
  const black = new THREE.MeshPhysicalMaterial({ color: 0x0b0b0c, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.12 });
  const cream = new THREE.MeshPhysicalMaterial({ color: 0xd9ccaa, roughness: 0.42, clearcoat: 0.3, clearcoatRoughness: 0.2 });   // Grok tune: aged cream, no bloom halo
  const dark = new THREE.MeshStandardMaterial({ color: 0x08080a, roughness: 0.75, metalness: 0.3 });
  const cmat = new THREE.MeshBasicMaterial({ visible: false });

  const vis = (m) => { m.castShadow = true; m.receiveShadow = true; return m; };
  const collBox = (parent, w, h, d, x, yTop, z, ry) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), cmat);
    m.position.set(x, yTop - h / 2, z); m.rotation.y = ry || 0; m.visible = false;
    parent.add(m); colliders.push(m); return m;
  };
  const collCyl = (parent, r, h, x, yTop, z) => {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 16), cmat);
    m.position.set(x, yTop - h / 2, z); m.visible = false;
    parent.add(m); colliders.push(m); return m;
  };

  // ---- shared small parts ----
  const screwGeo = new THREE.SphereGeometry(0.065, M ? 12 : 20, M ? 6 : 10, 0, Math.PI * 2, 0, Math.PI / 2);
  const slotGeo = new THREE.BoxGeometry(0.085, 0.02, 0.014);
  const screw = (parent, x, y, z, rot) => {
    const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = rot || 0;
    const dome = vis(new THREE.Mesh(screwGeo, chrome)); dome.scale.set(1, 0.58, 1); g.add(dome);
    const s1 = new THREE.Mesh(slotGeo, dark); s1.position.y = 0.031; g.add(s1);
    const s2 = new THREE.Mesh(slotGeo, dark); s2.position.y = 0.031; s2.rotation.y = Math.PI / 2; g.add(s2);
    parent.add(g); return g;
  };

  // =============== 1) PICKUPS ===============
  const GUARD = 0.06;
  const pickup = (cx, cz, L, Wd, rotDeg) => {
    const g = new THREE.Group(); g.position.set(cx, 0, cz); g.rotation.y = rotDeg * D2R;
    const geo = bd_sweep(bd_rrPts(L, Wd, 0.07, M ? 5 : 10), { T: 0.30, rT: 0.06, rB: 0.012, segT: M ? 3 : 6, capBot: false });
    hw_planarUV(geo, 0, 0.9, 2.2);
    const cover = vis(new THREE.Mesh(geo, [satin, chrome, chrome]));
    cover.position.y = GUARD + 0.30; g.add(cover);
    screw(g, -(L / 2 + 0.13), GUARD, 0, 0.4); screw(g, (L / 2 + 0.13), GUARD, 0, -0.9);
    collBox(g, L, 0.30, Wd, 0, GUARD + 0.30, 0, 0);
    group.add(g); return g;
  };
  pickup(0.04, -5.24, 2.3, 0.86, 0);
  pickup(0.05, -2.13, 2.3, 0.86, 0);   // Grok Nov 13: straight + same size as the neck pickup (pickups sheet + body-topdown photo)


  // =============== 2) WRAPAROUND BRIDGE — Grok rebuild from gpt-ref/bridge-sheet.png ===============

  const veneerEdgeMat = new THREE.MeshPhysicalMaterial({ color: 0x1a0e08, roughness: 0.5, metalness: 0, clearcoat: 0.6, clearcoatRoughness: 0.1, specularIntensity: 0.15 });

  const dotMat = new THREE.MeshPhysicalMaterial({ color: 0xefe9dc, roughness: 0.35, metalness: 0, clearcoat: 0.6, clearcoatRoughness: 0.1, specularIntensity: 0.2 });
  const nutMat = new THREE.MeshPhysicalMaterial({ color: 0xefe6cf, roughness: 0.4, metalness: 0, clearcoat: 0.35, clearcoatRoughness: 0.2, specularIntensity: 0.2 });
  const slotMat = new THREE.MeshStandardMaterial({ color: 0x2b241c, roughness: 0.7, metalness: 0 });
  const plainStrMat = new THREE.MeshStandardMaterial({ color: 0xf2f2f0, metalness: 1, roughness: 0.12 });
  const colliderMat = new THREE.MeshBasicMaterial({ visible: false });

  // ---------- fretboard ----------
  const fbPoly = [[-0.845, NUT_Z], [0.845, NUT_Z], [1.1, END_Z], [-1.1, END_Z]];
  const fbGeo = nk_prism(fbPoly, 0.10, 0.35);
  nk_projUV(fbGeo, (x) => x * 0.6 + 0.5, (x, y, z) => -z * 0.11);
  nk_mesh(fbGeo, rosewoodMat);

  // ---------- frets ----------
  const fretGeo = new THREE.CylinderGeometry(0.045, 0.045, 1, Q.mobile ? 8 : 12, 1);

    const z = nk_fretZ(n);

  // ---------- inlay dots (top) and side dots ----------
  const dotGeo = new THREE.CylinderGeometry(0.11, 0.11, 0.02, 20);
  const sideDotGeo = new THREE.SphereGeometry(0.035, 10, 8);
  const dotFrets = [3, 5, 7, 9, 12, 15, 17, 19, 21];
  for (const n of dotFrets) {
    const z = 0.5 * (nk_fretZ(n - 1) + nk_fretZ(n));
    const xs = n === 12 ? [-0.32, 0.32] : [0];
    for (const x of xs) { const d = nk_mesh(dotGeo, dotMat); d.position.set(x, 0.352, z); }
    const w = nk_w(z);
    const zs = n === 12 ? [z - 0.18, z + 0.18] : [z];
    for (const zz of zs) { const s = nk_mesh(sideDotGeo, dotMat); s.position.set(-w / 2 + 0.018, 0.225, zz); s.castShadow = false; }
  }

  // ---------- nut ----------
  const nutZ = NUT_Z - 0.095;
  const nut = nk_mesh(new THREE.BoxGeometry(1.72, 0.34, 0.19), nutMat);
  nut.position.set(0, 0.25, nutZ);
  const slotGeo = new THREE.BoxGeometry(0.03, 0.02, 0.2);
  for (let i = 0; i < 6; i++) {
    const s = nk_mesh(slotGeo, slotMat);
    s.position.set(-0.725 + i * 0.29, 0.418, nutZ); s.castShadow = false;
  }

  // ---------- maple neck back: swept C profile, with volute into the headstock ----------
  // neck4 (Grok Nov 14): no volute hump. Neck depth (from the fretboard top) tapers 0.92" at the body -> 0.84" at the nut,
  // then the carve fades into the flat headstock back (depth HT) over ~2" — Blake's headstock-back photo.
  const nk_neckD = (z) => 0.84 + 0.08 * Math.min(1, Math.max(0, (z - NUT_Z) / (-8.9 - NUT_Z)));
  const nk_hw = (s) => { const pts = HS_SHEET.side1; if (s <= pts[0][1]) return pts[0][0]; for (let i = 1; i < pts.length; i++) if (s <= pts[i][1]) { const a = pts[i - 1], b = pts[i], t = (s - a[1]) / (b[1] - a[1]); return a[0] + (b[0] - a[0]) * t; } return pts[pts.length - 1][0]; };
  const VOL_L = 2.6;
  // centre line of the back: stays level with the neck back past the nut, then bends (C1, smoothstep) into the
  // headstock back plane — no 6 degree fold at the nut, no hump
  const nk_volD = (s) => { const yN = 0.10 - nk_neckD(NUT_Z), yP = 0.10 - s * SA - HT * CA, yb = yN + (yP - yN) * nk_ss(s, 0, VOL_L); return (0.10 - s * SA - yb) / CA; };
  // edge depth of the carve = how thick the headstock is AT ITS OUTLINE: 0 at the nut (round neck sides) -> full HT by ~1.8"
  const nk_edge = (s) => (HT + 0.004) * nk_ss(s, 0.0, VOL_L * 0.85);
  const stations = [];
  let vAcc = 0, prevC = null;
  const pushSt = (c, ax, dn, w, d) => {
    if (prevC) vAcc += c.distanceTo(prevC);
    prevC = c;
    stations.push({ c, ax, dn, w, d, v: vAcc / 8 });
  };
  const NS = 36, Z0 = -8.0;   // neck4: starts INSIDE the body (end face at Z -8.9) — it comes straight out of the body, no carved heel
  for (let i = 0; i <= NS; i++) {
    const z = Z0 + (NUT_Z - Z0) * i / NS;
    pushSt(V3(0, 0.10, z), V3(1, 0, 0), V3(0, -1, 0), nk_w(z) - 0.004, nk_neckD(z));
    stations[stations.length - 1].e = 0;
  }
  const NH = Q.mobile ? 16 : 24;
  for (let i = 1; i <= NH; i++) {
    const s = VOL_L * Math.pow(i / NH, 1.3);
    const k = nk_ss(s, 0, VOL_L);
    // half-width follows the headstock outline (just inside it); edge depth = headstock thickness, centre fades 0.84 -> HT
    // neck5 (Grok Nov 14 14:57, Blake pic #2 'get rid of the line'): the loft used to END 0.004" proud of the flat back cap
    // (depth HT + .004 at s = VOL_L, cap at HT) -> a tiny lip straight across the headstock back that rendered as a dark line.
    // The 0.004 clearance now fades out (x 4k(1-k)) so the loft lands exactly on the cap plane, same depth, same normal.
    const lift = 0.004 * 4 * k * (1 - k), dep = i === NH ? HT : Math.max(HT + lift, nk_volD(s) + lift);
    pushSt(nk_F(0, s), V3(1, 0, 0), HN.clone().negate(), 2 * nk_hw(s) - 0.01, dep);
    stations[stations.length - 1].e = Math.min(nk_edge(s), dep);
    stations[stations.length - 1].p = 0.55 + 0.9 * k;
  }
  const M = Q.mobile ? 14 : 20;
  const BODY_BACK = 1.82;   // v3: body is 1.75" deep; heel reaches just past the back so there is no seam
  (function () {
    const pos = [], uv = [], idx = [];
    for (let i = 0; i < stations.length; i++) {
      const S = stations[i];
      for (let j = 0; j <= M; j++) {
        const th = -PI / 2 + PI * j / M, t = Math.sin(th);
        const e = S.e || 0, dep = e + (S.d - e) * Math.pow(Math.max(0, 1 - t * t), S.p || 0.55);
        const p = S.c.clone().addScaledVector(S.ax, t * S.w * 0.5).addScaledVector(S.dn, dep);
        pos.push(p.x, p.y, p.z); uv.push(0.05 + 0.9 * j / M, S.v);
      }
    }
    const row = M + 1;
    for (let i = 0; i < stations.length - 1; i++) for (let j = 0; j < M; j++) {
      const a = i * row + j, b = a + 1, c = a + row, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx); g.computeVertexNormals();
    nk_mesh(g, mapleMat);
  })();

  // ---------- v3 (Grok 7:51): carved neck heel — the set-neck joint flares from the C profile down into the body back ----------
  if (false) (function () {   // neck4: no carved heel (the neck leaves the body straight, Blake's back photos); kept for reference
    const NSH = 18, z0 = -8.15, z1 = -11.2, pos = [], uv = [], idx = [];
    for (let i = 0; i <= NSH; i++) {
      const t = i / NSH, z = z0 + (z1 - z0) * t;
      const e = Math.pow(1 - t, 1.7);                       // concave scoop, like a carved heel
      const dep = 0.85 + (BODY_BACK - 0.85) * e;
      const pw = 0.55 - 0.4 * e;                             // boxier where it meets the body
      const w = nk_w(z) - 0.004 + 0.1 * e;
      for (let j = 0; j <= M; j++) {
        const th = -PI / 2 + PI * j / M, tt = Math.sin(th);
        const d = dep * Math.pow(Math.max(0, 1 - tt * tt), pw);
        pos.push(tt * w * 0.5, 0.10 - d, z); uv.push(0.05 + 0.9 * j / M, -z / 8);
      }
    }
    const row = M + 1;
    for (let i = 0; i < NSH; i++) for (let j = 0; j < M; j++) { const a = i * row + j, b = a + 1, c = a + row, d = c + 1; idx.push(a, c, b, b, c, d); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx); g.computeVertexNormals();
    nk_mesh(g, mapleMat);
  })();

  // thin maple under-slab beneath the fretboard overhang (sits flat on the body top at Y=0)
  const usZ = -9.2, usW = nk_w(usZ) - 0.012;
  const usGeo = nk_prism([[-usW / 2, usZ], [usW / 2, usZ], [1.094, END_Z], [-1.094, END_Z]], 0.0, 0.10);
  nk_projUV(usGeo, (x) => x * 0.4 + 0.5, (x, y, z) => -z / 8);
  nk_mesh(usGeo, mapleMat);

  // ---------- headstock ----------
  const side1 = HS_SHEET.side1, side2 = HS_SHEET.side2;
  const nk_smooth = (pts, n) => new THREE.CatmullRomCurve3(pts.map(p => V3(p[0], p[1], 0)), false, 'centripetal').getPoints(n).map(p => [p.x, p.y]);
  const segs = Q.mobile ? 20 : 30;
  const outline = [...nk_smooth(side1, segs * 2), HS_SHEET.peakP, ...HS_SHEET.top, HS_SHEET.peak, ...nk_smooth(side2, segs * 2)];
  const headShape = new THREE.Shape(outline.map(p => new THREE.Vector2(p[0], p[1])));
  // local frame: x = model X, y = s (along face), z = thickness (0 = back, HT = face)
  const HM = new THREE.Matrix4().makeBasis(V3(1, 0, 0), V3(0, -SA, -CA), HN.clone()).setPosition(0, 0.10 - HT * CA, NUT_Z + HT * SA);
  const VEN = 0.06; // veneer thickness
  // neck4: maple edge walls + back cap trimmed to the carve. Near the nut the headstock edge is only as thick as the
  // carve's edge (nk_edge), so the round neck sides flow into the flat headstock with no step; the flat back cap starts at VOL_L.
  const hsWall = (zTopF, zBotF, mat, uvF) => {
    const pos = [], uv = [], idx = []; const n = outline.length;
    for (let i = 0; i <= n; i++) {
      const p = outline[i % n], zt = zTopF(p[1]), zb = zBotF(p[1]);
      pos.push(p[0], p[1], zt, p[0], p[1], Math.min(zt, zb));
      uv.push(...uvF(p[0], p[1], zt), ...uvF(p[0], p[1], zb));
      if (i < n) { const a = 2 * i; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx); g.computeVertexNormals(); g.applyMatrix4(HM);
    const m = nk_mesh(g, mat); return m;
  };
  const mapleSide = mapleMat.clone(); mapleSide.side = THREE.DoubleSide;
  const veneerSide = veneerEdgeMat.clone(); veneerSide.side = THREE.DoubleSide;
  const zEdge = (sv) => HT - Math.min(HT, nk_edge(sv));            // HM-local z of the headstock's back edge at s
  hsWall(() => HT - VEN, sv => zEdge(sv), mapleSide, (x, y, z) => [0.2 + z * 0.5 + x * 0.02, y / 8 + x * 0.03]);
  hsWall(() => HT, sv => Math.max(HT - VEN, zEdge(sv)), veneerSide, (x, y, z) => [z, y]);
  // flat maple back cap: only where the carve has fully faded (s >= VOL_L)
  const capPts = [], hwV = nk_hw(VOL_L);
  capPts.push([hwV, VOL_L]); for (const p of outline) if (p[1] > VOL_L) capPts.push(p); capPts.push([-hwV, VOL_L]);
  const capShape = new THREE.Shape(capPts.map(p => new THREE.Vector2(p[0], p[1])));
  const backCap = new THREE.ShapeGeometry(capShape);
  { const ix = backCap.index.array; const rev = new ix.constructor(ix.length); for (let i = 0; i < ix.length; i++) rev[i] = ix[ix.length - 1 - i]; backCap.setIndex(new THREE.BufferAttribute(rev, 1)); }
  nk_projUV(backCap, (x) => x * 0.33 + 0.5, (x, y) => y / 8 + 0.37);
  backCap.computeVertexNormals();
  backCap.applyMatrix4(HM);
  nk_mesh(backCap, mapleMat);
  // rosewood face with the real photo (logo + truss-rod cover baked in)
  const faceCap = new THREE.ShapeGeometry(headShape);
  faceCap.translate(0, 0, HT);
  nk_projUV(faceCap, (x) => (1.6 - x) / 3.2, (x, y) => 1 - (y + 0.1) / 7.8);
  faceCap.applyMatrix4(HM);
  nk_mesh(faceCap, headFaceMat);
  // 3D truss-rod cover: black crinkle teardrop, wide end at the nut, 3 screws (Nov 13 photo)
  {
    const trc = [[0.5, 0.12], [0.52, 0.6], [0.38, 1.5], [0.27, 2.2], [0.05, 2.56], [-0.17, 2.2], [-0.28, 1.5], [-0.42, 0.6], [-0.42, 0.12]];
    const pts = HS_SHEET.trc.map(p => new THREE.Vector2(p[0], p[1]));
    const cv = document.createElement('canvas'); cv.width = cv.height = 256; const cg = cv.getContext('2d');
    cg.fillStyle = '#141416'; cg.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 9000; i++) { const v = nk_rand(), r = 0.7 + nk_rand() * 1.6; cg.fillStyle = v < 0.5 ? `rgba(0,0,0,${(0.3 + nk_rand() * 0.4).toFixed(2)})` : `rgba(${120 + nk_rand() * 60 | 0},${120 + nk_rand() * 60 | 0},${125 + nk_rand() * 60 | 0},${(0.18 + nk_rand() * 0.3).toFixed(2)})`; cg.fillRect(nk_rand() * 256, nk_rand() * 256, r, r); }
    const ct = new THREE.CanvasTexture(cv); ct.colorSpace = THREE.SRGBColorSpace; ct.wrapS = ct.wrapT = THREE.RepeatWrapping; ct.repeat.set(2, 2);
    const trcMat = new THREE.MeshStandardMaterial({ map: ct, bumpMap: ct, bumpScale: 0.6, roughness: 0.82, metalness: 0.05 });
    const tg = new THREE.ExtrudeGeometry(new THREE.Shape(pts), { depth: 0.025, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.02, bevelSegments: 3, curveSegments: 8 });
    nk_projUV(tg, (x) => x, (x, y) => y);
    tg.translate(0, 0, HT + 0.012); tg.applyMatrix4(HM);
    const tm = nk_mesh(tg, trcMat); tm.castShadow = false;
    const scrMat = new THREE.MeshStandardMaterial({ color: 0xd8dadc, metalness: 1, roughness: 0.25 });
    const slotMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.8 });
    const sh = new THREE.SphereGeometry(0.06, 14, 7, 0, PI * 2, 0, PI / 2); sh.scale(1, 0.45, 1);
    for (const [x, s2] of HS_SHEET.trcScrews) {
      const p0 = nk_F(x, s2).addScaledVector(HN, 0.05);
      const sm = nk_mesh(sh, scrMat); sm.position.copy(p0); sm.quaternion.setFromUnitVectors(V3(0, 1, 0), HN); sm.castShadow = false;
      for (const r of [0, PI / 2]) { const sl = nk_mesh(new THREE.BoxGeometry(0.08, 0.012, 0.014), slotMat); sl.position.copy(p0).addScaledVector(HN, 0.022); sl.quaternion.copy(sm.quaternion); sl.rotateY(0.4 + r); sl.castShadow = false; }
    }
  }

  // ---------- strings ----------
  const unitCyl = new THREE.CylinderGeometry(1, 1, 1, Q.mobile ? 6 : 8, 1);
  const UP = V3(0, 1, 0);
  function nk_cyl(p0, p1, r, mat) {
    const d = new THREE.Vector3().subVectors(p1, p0); const len = d.length();
    const m = new THREE.Mesh(unitCyl, mat);
    m.scale.set(r, len, r);
    m.position.copy(p0).addScaledVector(d, 0.5);
    m.quaternion.setFromUnitVectors(UP, d.normalize());
    group.add(m);
    return { mesh: m, len };
  }
  // wound-string stripe texture
  const wc = document.createElement('canvas'); wc.width = 4; wc.height = 16;
  const wg = wc.getContext('2d');
  wg.fillStyle = '#e4dccc'; wg.fillRect(0, 0, 4, 16);
  wg.fillStyle = '#6a6256'; wg.fillRect(0, 8, 4, 8);
  wg.fillStyle = '#b3a996'; wg.fillRect(0, 6, 4, 2);
  const woundTex = new THREE.CanvasTexture(wc);
  woundTex.wrapS = woundTex.wrapT = THREE.RepeatWrapping; woundTex.colorSpace = THREE.SRGBColorSpace;
  const nk_woundMat = (len) => {
    const t = woundTex.clone(); t.repeat.set(1, len / 0.05); t.needsUpdate = true;
    return new THREE.MeshStandardMaterial({ color: 0xcfc6b4, metalness: 1, roughness: 0.35, map: t });
  };
  const posts = [[-0.835, 2.18], [-0.806, 3.756], [-0.737, 5.36], [0.737, 5.36], [0.806, 3.756], [0.835, 2.18]];   // low E -> high E; +X side mirrored from the -X (correct) side
  const dias = [0.046, 0.036, 0.026, 0.017, 0.013, 0.010];
  for (let i = 0; i < 6; i++) {
    const r = Math.max(dias[i] / 2, 0.008);
    const wound = i < 3;
    const pBridge = V3(-1.025 + i * 0.41, 0.62 + r * 0.5, -0.15);
    const pNut = V3(-0.725 + i * 0.29, 0.42 + r, NUT_Z);
    const pPost = nk_F(posts[i][0], posts[i][1]).addScaledVector(HN, typeof tn_holeH === 'function' ? tn_holeH(posts[i][0], posts[i][1]) : 0.35);   // neck5: ends IN the post's string hole (tuners5), was 0.35 = between wraps
    for (const [a, b] of [[pBridge, pNut], [pNut, pPost]]) {
      const len = a.distanceTo(b);
      nk_cyl(a, b, r, wound ? nk_woundMat(len) : plainStrMat);
    }
  }

  // ---------- colliders (invisible, top faces walkable) ----------
  const fbInset = [[-0.82, NUT_Z + 0.02], [0.82, NUT_Z + 0.02], [1.07, END_Z - 0.02], [-1.07, END_Z - 0.02]];
  const fbCol = new THREE.Mesh(nk_prism(fbInset, 0.33, 0.35), colliderMat); fbCol.visible = false; group.add(fbCol); colliders.push(fbCol);
  // v3: filler under the nut's front edge — the fretboard collider stops 0.02" short of the nut box, and that sliver had NO ground (walker got stuck at small steps)
  const gapCol = new THREE.Mesh(new THREE.BoxGeometry(1.64, 0.02, 0.24), colliderMat); gapCol.position.set(0, 0.34, NUT_Z + 0.04 - 0.12); gapCol.visible = false; group.add(gapCol); colliders.push(gapCol);
  const nutCol = new THREE.Mesh(new THREE.BoxGeometry(1.72, 0.02, 0.19), colliderMat); nutCol.position.set(0, 0.41, nutZ); nutCol.visible = false; group.add(nutCol); colliders.push(nutCol);
  const headCol = new THREE.Mesh(faceCap.clone(), colliderMat); headCol.visible = false; group.add(headCol); colliders.push(headCol);
  // Grok v3: tuner posts are solid for the walker (taller than STEP, so you walk AMONG them, not through or onto them)
  for (const [px, ps] of posts) {
    const pc = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 1.6, 12), colliderMat);
    pc.position.copy(nk_F(px, ps)).add(V3(0, 0.75, 0)); pc.visible = false; pc.userData.wall = true; group.add(pc); colliders.push(pc);
  }

  // ---------- shadows ----------
  group.traverse(o => { if (o.isMesh && o.visible) { if (o.castShadow !== false) o.castShadow = true; o.receiveShadow = true; } });

  // ---------- footprint & anchors ----------
  const footprint = [
    // Grok v3: fretboard footprint overlaps 0.4" past the nut, so there is no sliver between the neck and headstock footprints
    [[-0.82, NUT_Z + 0.02], [0.82, NUT_Z + 0.02], [0.82, NUT_Z - 0.4], [-0.82, NUT_Z - 0.4]],
    fbInset.map(p => [p[0], p[1]]),
    outline.map(([x, s]) => [x, NUT_Z - s * CA])
  ];
  const hf = nk_F(0, 3.7), hb = hf.clone().addScaledVector(HN, -HT);
  const anchors = {
    nut: [0, 0.42, NUT_Z],
    neckMid: [0, 0.35, -15],
    headstockFace: [hf.x, hf.y, hf.z],
    headstockBack: [hb.x, hb.y, hb.z],
    neckBack: [0, -0.75, -15]
  };
  return { group, colliders, footprint, anchors };
}

// ===================== TUNERS PART (v4, Grok Nov 13 9:09: D'Addario clip pulled in to its real size/position; v3 kept in tuners3.js) =====================
// 3+3 sealed chrome tuners (face bushings/posts/string wraps, back housings with
// brushed "Taylor" caps, tulip buttons) + D'Addario clip-on tuner on the bass edge.
// All built inside a "headstock frame" group H: local +Y = face normal, local z = -s,
// face at y=0, back at y=-0.55. H is rotated/positioned into the model frame.

const TN_A = 6 * Math.PI / 180;
const TN_OUT_T = HS_SHEET.side1.slice().sort((a,b)=>a[1]-b[1]);
const TN_OUT_B = HS_SHEET.side2.slice().sort((a,b)=>a[1]-b[1]);
// tuners5 (Grok Nov 14 14:57, Blake pic #3 'make the hole line up with the string entrance'): each post's string hole now sits
// right above its top wrap at the height the string arrives, and points along that string toward its nut slot; neck5 ends the
// string at the same point (tn_holeH), so every string visibly goes into its post hole. tuners4 kept.
const TN_WRAPS = i => 2 + (i % 2);
const TN_HOLE_H = i => 0.30 + TN_WRAPS(i) * 0.045 + 0.005;
function tn_holeH(X, s) { let bi = 0, bd = 1e9; TN_POSTS.forEach((p, i) => { const d = Math.hypot(p[0] - X, p[1] - s); if (d < bd) { bd = d; bi = i; } }); return TN_HOLE_H(bi); }
const TN_POSTS = [[0.835, 2.18], [0.806, 3.756], [0.737, 5.36], [-0.835, 2.18], [-0.806, 3.756], [-0.737, 5.36]];   // Grok v3: symmetric (+X mirrored from the correct -X side)
const TN_ROLL = [0.35,-0.55,0.15,-0.3,0.6,-0.12];

let tn_seed = 7;
function tn_rnd(){ tn_seed = (tn_seed * 16807) % 2147483647; return (tn_seed - 1) / 2147483646; }

function tn_edgeX(s, side){
  const L = side > 0 ? TN_OUT_T : TN_OUT_B;
  for (let i = 0; i < L.length - 1; i++){
    const a = L[i], b = L[i+1];
    if (s >= a[1] && s <= b[1]){ const t = (s - a[1]) / (b[1] - a[1]); return a[0] + (b[0] - a[0]) * t; }
  }
  return L[L.length-1][0];
}

function tn_canvas(size, draw){
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = (typeof Q !== 'undefined' && Q.aniso) ? Q.aniso : 4;
  return t;
}

function tn_roundRect(w, h, r, cx = 0, cy = 0){
  const s = new THREE.Shape(), x = cx - w/2, y = cy - h/2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

// Tombstone: flat bottom, big rounded top (centered at origin, width w, height h)
function tn_tombstone(w, h, rb){
  const s = new THREE.Shape(), hw = w/2, hh = h/2;
  s.moveTo(-hw + rb, -hh);
  s.lineTo(hw - rb, -hh); s.quadraticCurveTo(hw, -hh, hw, -hh + rb);
  s.lineTo(hw, hh - hw);
  s.absarc(0, hh - hw, hw, 0, Math.PI, false);
  s.lineTo(-hw, -hh + rb); s.quadraticCurveTo(-hw, -hh, -hw + rb, -hh);
  return s;
}

// Tulip / paddle button outline, shaft end at x=0, tip at x=0.55, width 0.45
function tn_paddleShape(){
  // Nov 13 (gpt-image tuner sheet + photo): keystone/tulip — narrow neck, quick flare, near-parallel sides, flat end with chamfered corners
  const top = [[0,0.06],[0.05,0.075],[0.13,0.17],[0.19,0.205],[0.47,0.19],[0.53,0.14],[0.55,0.07]];
  const pts = top.map(p => new THREE.Vector2(p[0], p[1]));
  for (let i = top.length - 1; i >= 0; i--) pts.push(new THREE.Vector2(top[i][0], -top[i][1]));
  const s = new THREE.Shape(pts);
  return s;
}

// Orientation whose local x'=-X, y'=-Z (toward tip), z'=-Y (away from the back).
// A plane/circle (facing +z', uv up = +y') oriented this way reads upright and
// un-mirrored for a camera behind the headstock looking at the back with the tip up.
const TN_Q_DOWN = new THREE.Quaternion().setFromRotationMatrix(
  new THREE.Matrix4().makeBasis(new THREE.Vector3(-1,0,0), new THREE.Vector3(0,0,-1), new THREE.Vector3(0,-1,0)));

function tn_mesh(geo, mat, parent, x, y, z, noCast){
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = !noCast; m.receiveShadow = true;
  if (x !== undefined) m.position.set(x, y, z);
  parent.add(m);
  return m;
}

function tn_capTexture(){
  return tn_canvas(256, (g, S) => {
    const c = S / 2;
    g.fillStyle = '#b4b5b9'; g.fillRect(0, 0, S, S);
    // radial brushed lines
    g.lineWidth = 1;
    for (let i = 0; i < 900; i++){
      const a = tn_rnd() * Math.PI * 2, r0 = 6 + tn_rnd() * 20, r1 = r0 + 40 + tn_rnd() * 100;
      const v = tn_rnd() < 0.5 ? 255 : 30;
      g.strokeStyle = `rgba(${v},${v},${v},${0.04 + tn_rnd() * 0.12})`;
      g.beginPath(); g.moveTo(c + Math.cos(a) * r0, c + Math.sin(a) * r0);
      g.lineTo(c + Math.cos(a) * r1, c + Math.sin(a) * r1); g.stroke();
    }
    // soft anisotropic highlight
    const gr = g.createLinearGradient(0, 0, S, S);
    gr.addColorStop(0, 'rgba(255,255,255,0.18)'); gr.addColorStop(0.45, 'rgba(255,255,255,0)');
    gr.addColorStop(0.55, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.22)');
    g.fillStyle = gr; g.fillRect(0, 0, S, S);
    // ring of tiny dots
    for (let i = 0; i < 40; i++){
      const a = i / 40 * Math.PI * 2, x = c + Math.cos(a) * 104, y = c + Math.sin(a) * 104;
      g.fillStyle = '#2a2a2c'; g.beginPath(); g.arc(x, y, 2.6, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.35)'; g.beginPath(); g.arc(x - 0.8, y - 0.8, 1.0, 0, Math.PI * 2); g.fill();
    }
    // rim bevel shade
    g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 6; g.beginPath(); g.arc(c, c, c - 4, 0, Math.PI * 2); g.stroke();
    // "Taylor" script (not mirrored: geometry orientation handles the view)
    g.save(); g.translate(c, c + 4); g.rotate(-0.12);
    g.fillStyle = '#121212'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = 'italic 700 62px "Brush Script MT","Segoe Script","Apple Chancery","Snell Roundhand",cursive';
    g.fillText('Taylor', 0, 0);
    g.restore();
  });
}

function tn_displayTexture(){
  return tn_canvas(512, (g, S) => {
    g.fillStyle = '#0a0a0b'; g.fillRect(0, 0, S, S);
    const gl = g.createLinearGradient(0, 0, S, S * 0.6);
    gl.addColorStop(0, 'rgba(255,255,255,0.07)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gl; g.fillRect(0, 0, S, S);
    g.strokeStyle = '#f2f2f2'; g.fillStyle = '#f2f2f2'; g.lineCap = 'round'; g.lineJoin = 'round';
    // top row: "<"  refresh  ">"
    g.font = '700 64px Helvetica, Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('<', 150, 150); g.fillText('>', 362, 150);
    g.lineWidth = 9; g.beginPath(); g.arc(256, 150, 30, 0.35 * Math.PI, 1.85 * Math.PI); g.stroke();
    g.beginPath(); g.moveTo(256 + 30 * Math.cos(1.85 * Math.PI) + 10, 150 + 30 * Math.sin(1.85 * Math.PI) - 18);
    g.lineTo(256 + 30 * Math.cos(1.85 * Math.PI) + 12, 150 + 30 * Math.sin(1.85 * Math.PI) + 8);
    g.lineTo(256 + 30 * Math.cos(1.85 * Math.PI) - 14, 150 + 30 * Math.sin(1.85 * Math.PI) + 2);
    g.closePath(); g.fill();
    // power button: rounded square with power icon
    g.lineWidth = 4; g.strokeStyle = '#8a8a8c';
    const rr = (x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
      g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
      g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath(); };
    rr(186, 220, 140, 140, 22); g.stroke();
    g.strokeStyle = '#f2f2f2'; g.lineWidth = 10;
    g.beginPath(); g.arc(256, 294, 40, -0.3 * Math.PI, 1.3 * Math.PI); g.stroke();
    g.beginPath(); g.moveTo(256, 236); g.lineTo(256, 288); g.stroke();
    // brand
    g.font = '700 54px Helvetica, Arial, sans-serif';
    g.fillText("D'Addario", 256, 436);
  });
}

function buildTuners(){
  const group = new THREE.Group();
  group.name = 'tuners';

  // headstock frame
  const H = new THREE.Group();
  H.position.set(0, 0.10, -24.7);
  H.rotation.x = -TN_A;
  group.add(H);

  // ---- materials ----
  const chromeCurved = new THREE.MeshPhysicalMaterial({ color: 0xe8e8ea, metalness: 1, roughness: 0.1 });
  const chromeFlat   = new THREE.MeshPhysicalMaterial({ color: 0xe4e4e6, metalness: 1, roughness: 0.22 });
  const chromeDark   = new THREE.MeshPhysicalMaterial({ color: 0x9a9a9e, metalness: 1, roughness: 0.3 });
  const capTex2 = tn_capTexture(); const capMat = new THREE.MeshStandardMaterial({ map: capTex2, color: 0xffffff, metalness: 0.35, roughness: 0.45, emissive: 0xffffff, emissiveMap: capTex2, emissiveIntensity: 0.22 });   // Grok v2: cap + Taylor readable in the black void   // Grok tune: less mirror so the brushed cap + Taylor read in the black void
  const stringMat = new THREE.MeshStandardMaterial({ color: 0xd9d9dc, metalness: 1, roughness: 0.32 });
  const blackMat = new THREE.MeshPhysicalMaterial({ color: 0x141414, roughness: 0.7, metalness: 0, specularIntensity: 0.18 });
  const rubberMat = new THREE.MeshPhysicalMaterial({ color: 0x0c0c0c, roughness: 0.95, metalness: 0, specularIntensity: 0.1 });
  const dispTex = tn_displayTexture();
  const dispMat = new THREE.MeshPhysicalMaterial({
    map: dispTex, color: 0xffffff, emissive: 0xffffff, emissiveMap: dispTex, emissiveIntensity: 0.28,
    roughness: 0.12, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.04, specularIntensity: 0.6 });
  const holeMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.9, metalness: 0.2 });

  // ---- shared geometries ----
  const washerGeo = new THREE.CylinderGeometry(0.25, 0.255, 0.035, 32);   // Nov 13: real washer ~0.5 dia
  const nutGeo = new THREE.CylinderGeometry(0.205, 0.205, 0.12, 6);
  const postGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.45, 20);
  const tipGeo = new THREE.CylinderGeometry(0.095, 0.12, 0.03, 20);
  const holeGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.26, 10);
  const wrapThin = new THREE.TorusGeometry(0.128, 0.011, 7, 28);
  const wrapThick = new THREE.TorusGeometry(0.133, 0.018, 7, 28);
  const housingGeo = new THREE.ExtrudeGeometry(tn_roundRect(0.62, 0.75, 0.17), {
    depth: 0.40, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 3, curveSegments: 8 });
  const housCylGeo = new THREE.CylinderGeometry(0.285, 0.285, 0.40, 40);   // v4: sheet SIDE 0.45" incl. cap
  // Grok v2 (tuners sheet TOP/SIDE): tapered cone nose from the barrel into the shaft
  const noseGeo = new THREE.CylinderGeometry(0.08, 0.16, 0.42, 40, 1, false);   // v4: slimmer so it stays inside the shorter barrel (it was poking through the Taylor caps) noseGeo.rotateZ(-Math.PI / 2);   // wide end at -X
  const capGeo = new THREE.CylinderGeometry(0.275, 0.265, 0.045, 36);
  const capFaceGeo = new THREE.CircleGeometry(0.262, 36);
  const collarGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.09, 18);
  const shaftGeo = new THREE.CylinderGeometry(0.07, 0.07, 1, 14);
  const paddleGeo = new THREE.ExtrudeGeometry(tn_paddleShape(), {
    depth: 0.1, bevelEnabled: true, bevelThickness: 0.035, bevelSize: 0.025, bevelSegments: 4, curveSegments: 6 });
  paddleGeo.translate(0, 0, -0.05);
  const screwGeo = new THREE.CylinderGeometry(0.045, 0.045, 0.03, 12);

  // ---- six tuners ----
  for (let i = 0; i < 6; i++){
    const X = TN_POSTS[i][0], s = TN_POSTS[i][1], z = -s;
    const side = X > 0 ? 1 : -1;
    const T = new THREE.Group(); T.position.set(X, 0, z); H.add(T);

    // FACE side: washer, hex nut, post, tip, string hole, wraps
    tn_mesh(washerGeo, chromeCurved, T, 0, 0.0175, 0);
    tn_mesh(nutGeo, chromeCurved, T, 0, 0.095, 0).rotation.y = (i * 0.37) % (Math.PI / 3);
    tn_mesh(postGeo, chromeCurved, T, 0, 0.155 + 0.225, 0);
    tn_mesh(tipGeo, chromeCurved, T, 0, 0.155 + 0.45 + 0.015, 0);
    // string hole: at the string's arrival height, axis along the string (post -> its nut slot; nut slots 0.145/0.435/0.725 from the centre, farthest post = innermost slot)
    const rank = [2.18, 3.756, 5.36].indexOf(s), nutX = side * [0.725, 0.435, 0.145][rank < 0 ? 0 : rank];
    const hole = tn_mesh(holeGeo, holeMat, T, 0, TN_HOLE_H(i), 0, true);
    hole.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(nutX - X, 0, s).normalize());
    const wrapGeo = side > 0 ? wrapThin : wrapThick;
    const nWrap = TN_WRAPS(i);
    for (let w = 0; w < nWrap; w++){
      const wr = tn_mesh(wrapGeo, stringMat, T, 0, 0.30 + w * 0.045, 0, true);
      wr.rotation.x = Math.PI / 2; wr.rotation.y = 0.06;
    }

    // BACK side: sealed housing + brushed cap
    const hz = 0.06; // nudge housing toward the nut
    // Nov 13 (Blake's back photo + gpt sheet): round polished barrel + squared gearbox nose toward the button side
    tn_mesh(housCylGeo, chromeCurved, T, 0, -0.55 - 0.20, hz);
    { const nm = tn_mesh(noseGeo, chromeCurved, T, side * 0.23, -0.77, hz); if (side < 0) nm.rotation.z = Math.PI; }
    const capY = -0.56 - 0.40 - 0.0225;
    tn_mesh(capGeo, chromeFlat, T, 0, capY, hz);
    const capFace = tn_mesh(capFaceGeo, capMat, T, 0, capY - 0.0225 - 0.005, hz, true);   // v4: 0.005 (was 0.002: z-fought at long range)
    capFace.quaternion.copy(TN_Q_DOWN);
    tn_mesh(screwGeo, chromeDark, T, 0, -0.565, 0.52, true);

    // sideways shaft + tulip button past the headstock edge
    const shaftY = -0.77;   // v4: centred on the 0.40" barrel
    // Nov 13 fix: btnStart is LOCAL to the tuner (was the absolute edge X -> buttons floated ~1" out on long shafts)
    const btnStart = side * 0.46;   // v4: tuners sheet TOP: barrel far edge -> button start = 0.75"
    const x0 = side * 0.3, x1 = btnStart + side * 0.03;
    const shaft = tn_mesh(shaftGeo, chromeCurved, T, (x0 + x1) / 2, shaftY, hz);
    shaft.scale.y = Math.abs(x1 - x0); shaft.rotation.z = Math.PI / 2;
    const collar = tn_mesh(collarGeo, chromeCurved, T, side * 0.42, shaftY, hz);
    collar.rotation.z = Math.PI / 2;
    const paddle = tn_mesh(paddleGeo, chromeCurved, T, btnStart, shaftY, hz);
    const px = new THREE.Vector3(side, 0, 0), py = new THREE.Vector3(0, 0, 1);
    const pz = new THREE.Vector3().crossVectors(px, py);
    paddle.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(px, py, pz));
    paddle.rotateX(TN_ROLL[i] * 0.3); paddle.scale.set(1.05, 1.05, 1.0);   // v4 (Blake 9:09 'sticking out too much'): sheet size 0.58" x 0.45" (v2 had 1.25x = 0.69" x 0.51")
  }

  // ---- D'Addario clip-on tuner (bass edge, near the nut) ----
  // Grok v4 (Blake 9:09 "it's sticking out too much"): his front + back photos show the clip body sitting ON the back of the
  // headstock next to the bass tuner nearest the nut, only the jaw/hinge peeking ~0.3" past the edge. Was: body 0.85" outside the edge.
  // Also a touch smaller (photo: ~0.95" x 1.1" vs the Taylor cap's 0.55") and moved up past the volute so it sits flat.
  const cs = 1.22, cz = -cs;
  const edgeX = tn_edgeX(cs, -1);
  const bodyW = 0.95, bodyH = 1.1, bodyD = 0.3;
  const bodyCX = edgeX - 0.12 + bodyW / 2;          // outer edge only 0.12" past the headstock edge
  const C = new THREE.Group(); C.position.set(bodyCX, 0, cz); H.add(C);

  const bodyShape = tn_tombstone(bodyW, bodyH, 0.12);
  bodyShape.holes.push(tn_roundRect(0.69, 0.69, 0.09, 0, 0.04));
  const bodyGeo = new THREE.ExtrudeGeometry(bodyShape, {
    depth: bodyD, bevelEnabled: true, bevelThickness: 0.045, bevelSize: 0.045, bevelSegments: 3, curveSegments: 10 });
  const body = tn_mesh(bodyGeo, blackMat, C, 0, -0.60, 0);
  body.quaternion.copy(TN_Q_DOWN);
  // plug behind the display opening + recessed glossy display
  tn_mesh(new THREE.BoxGeometry(0.72, 0.27, 0.72), blackMat, C, 0, -0.60 - 0.135, -0.04);
  const disp = tn_mesh(new THREE.PlaneGeometry(0.67, 0.67), dispMat, C, 0, -0.60 - 0.27 - 0.002, -0.04, true);
  disp.quaternion.copy(TN_Q_DOWN);
  // clip jaw: side bar outside the edge, top lip over the face, rubber pad, hinge pin
  const jx = edgeX - bodyCX;
  tn_mesh(new THREE.BoxGeometry(0.16, 0.72, 0.42), blackMat, C, jx - 0.075, -0.22, 0);   // v4: slimmer jaw hugging the edge
  tn_mesh(new THREE.BoxGeometry(0.34, 0.09, 0.42), blackMat, C, jx + 0.02, 0.095, 0);
  tn_mesh(new THREE.BoxGeometry(0.24, 0.04, 0.36), rubberMat, C, jx + 0.08, 0.025, 0, true);
  const hinge = tn_mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.46, 16), blackMat, C, jx - 0.15, -0.64, 0);
  hinge.rotation.x = Math.PI / 2;
  // small chrome swivel ball between jaw and body
  tn_mesh(new THREE.SphereGeometry(0.06, 12, 10), chromeDark, C, jx - 0.15, -0.64, 0.27, true);

  // ---- anchors (model frame) ----
  H.updateMatrix();
  const toModel = (x, y, z) => { const p = new THREE.Vector3(x, y, z).applyMatrix4(H.matrix); return [p.x, p.y, p.z]; };
  const anchors = {
    tunerClip: toModel(bodyCX, -0.78, cz),
    headstockBack: toModel(0, -0.55, -3.5)
  };

  return { group, colliders: [], footprint: [], anchors };
}

/* ===================== App v7 (Grok, Nov 14 9:46, Blake 'this is messy': back-walk side walls get a soft room bounce so they read as lit wood) — App v6 (Grok, Nov 14 9:02: frame-rate independent jump arc — AUDITOR rerun) — App v5 (Grok, Nov 14 7:54: side fill lights when walking on the back so the body sides read as lit cherry wood, ledge climb from the neck back onto the body back) — App v4 (Grok, Nov 13 9:28: walkable back — Back button flips the guitar in Walk too, walker lands on the back of body/neck/heel/headstock; tuners + clip are solid walls there) — App v3 (Grok, Nov 13 7:51: faster stick, walkable headstock, 360 photo orbit + Back/flip button) — App v2 (Grok, Nov 13 7:10: smooth pointer-event controls, analog joystick, life-like walk scale, steady photo view) — from app.js: loading, model assembly, walker (bound to the guitar), photo view, debug API ===================== */
const V3 = THREE.Vector3;
const TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;
if (TOUCH) document.body.classList.add('touch');
const hint = document.getElementById('hint');
const HINT_WALK = TOUCH ? 'Left stick to walk · drag to look · ◆ jump · Back = walk on the back' : 'WASD to walk (Shift = faster) · click/drag to look · Space to jump · B = walk on the back · P photo view';
const HINT_BACK = TOUCH ? 'On the back · Left stick to walk · Front = back to the top' : 'On the back · WASD to walk · B or Front = back to the top';
hint.textContent = HINT_WALK;
const hideHint = () => hint.classList.add('gone');

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', stencil: false });
const MOBILE = TOUCH || Math.min(screen.width, screen.height) < 600;
let pr = Math.min(window.devicePixelRatio || 1, MOBILE ? 2 : 1.75);
renderer.setPixelRatio(pr);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
Q.mobile = MOBILE; Q.aniso = Math.min(renderer.capabilities.getMaxAnisotropy(), MOBILE ? 4 : 8); Q.shadowSize = MOBILE ? 1024 : 2048;

/* ---------- textures ---------- */
const lbar = document.getElementById('lbar');
const loader = new THREE.TextureLoader();
// app8 (nov14c, Blake pic #4/#5): cleaned top photo (no baked guard-edge lines, no blurred knob/toggle blobs; nov14c-clean-top.py),
// full 2048 on phones too so the guard near the knobs and switch is sharp up close (was top-1024 on mobile).
const files = { top: 'top-2048-v2.jpg', wood: 'wood-1024.jpg', maple: 'maple.jpg', headFace: 'headstock-face-sym.jpg', knobVol: 'knob-volume.jpg', knobTone: 'knob-tone.jpg', knobSkirt: 'knob-skirt.jpg', label1225: 'label-1225.jpg', labelBPZ: 'label-bpz.jpg' };
let nLoaded = 0;
await Promise.all(Object.entries(files).map(([k, f]) => new Promise((res, rej) => loader.load('assets/' + f, t => {
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = Q.aniso;
  TX[k] = t; nLoaded++; lbar.style.width = (100 * nLoaded / Object.keys(files).length) + '%'; res(t);
}, undefined, e => rej(new Error('texture ' + f))))));

/* ---------- scene, model ---------- */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.05, 2000);
const BODY = buildBody(), NECK = buildNeck(), TUN = (typeof buildTuners === 'function') ? buildTuners() : null, HW = (typeof buildHardware === 'function') ? buildHardware() : null;
const G = new THREE.Group(); G.add(BODY.group, NECK.group); if (TUN) G.add(TUN.group); if (HW) G.add(HW.group);
G.scale.setScalar(3); G.position.set(0, 24 + 1.75 * 3, 0);   // back of the body floats 8" (24 units) over the floor
scene.add(G);
// Grok v2: every solid mesh casts + receives shadows (neck2's traverse never fired: castShadow defaults to false,
// so the neck/headstock were missing from the floor shadow). Skip only transparent/polygon-offset decals.
G.traverse(o => { if (o.isMesh && o.visible) { const m = o.material; if (!(m && (m.transparent || m.polygonOffset))) o.castShadow = true; o.receiveShadow = true; } });
scene.updateMatrixWorld(true);
const GT = {
  colliders: [...BODY.colliders, ...NECK.colliders, ...(TUN ? TUN.colliders : []), ...(HW ? HW.colliders : [])],
  footprint: [...BODY.footprint, ...NECK.footprint],
  anchors: Object.assign({}, BODY.anchors, NECK.anchors, TUN ? TUN.anchors : {}),
};
GT.spawn = GT.anchors.spawn || [0, 0.62, 0.25];
const bbox = new THREE.Box3().setFromObject(G), bc = bbox.getCenter(new V3()), bs = bbox.getSize(new V3());
const L = Math.max(bs.x, bs.z, 1);
const STAGE = setupStage(renderer, scene, camera, { center: bc.clone(), radius: L * 0.55 });
// v7: nothing that casts a shadow moves except while the guitar turns over (applyFlip), so render the key's shadow map (and its
// VSM blur) once instead of every frame: the softer stage5 shadow then costs nothing per frame (measured 1.88 -> 1.25 fps in the
